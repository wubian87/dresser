<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today's Outfit</title>
<style>
  :root { --bg:#faf7f2; --ink:#2b2622; --muted:#7b726a; --accent:#b4573d; --card:#fff; --line:#e8e0d5; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:560px; margin:0 auto; padding:16px 16px 48px; }
  h1 { font-size:1.5rem; margin:8px 0 2px; }
  .sub { color:var(--muted); font-size:.9rem; margin-bottom:14px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  label { font-weight:600; display:block; margin-bottom:6px; }
  .temp { display:flex; align-items:center; gap:12px; }
  input[type=range] { flex:1; accent-color:var(--accent); }
  .tempval { min-width:4.2rem; text-align:right; font-weight:700; font-size:1.2rem; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:9px 16px; font-size:1rem; cursor:pointer; color:var(--ink); }
  .chip[aria-pressed=true] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .row { margin-top:14px; }
  button.go { width:100%; padding:14px; font-size:1.1rem; border:0; border-radius:12px; background:var(--ink); color:#fff; cursor:pointer; }
  button.go:disabled { opacity:.5; }
  .outfit { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:12px; }
  .pieces { display:flex; gap:6px; overflow-x:auto; }
  .piece { flex:0 0 auto; width:92px; text-align:center; font-size:.72rem; color:var(--muted); }
  .piece img { width:92px; height:92px; border-radius:10px; background:#f4f1ec; object-fit:cover; display:block; }
  .reason { margin:10px 2px 2px; }
  .tag { display:inline-block; font-size:.7rem; padding:2px 8px; border-radius:99px; background:#efe7dc; color:var(--muted); margin-top:6px; }
  .warn { color:#8a4b00; background:#fff3e0; border-radius:10px; padding:8px 12px; font-size:.9rem; margin-bottom:12px; }
  footer { color:var(--muted); font-size:.8rem; text-align:center; margin-top:24px; }
</style>
</head>
<body>
<main>
  <h1>Today's Outfit</h1>
  <div class="sub" id="status">…</div>

  <div class="panel">
    <label for="temp">Temperature</label>
    <div class="temp"><input id="temp" type="range" min="-5" max="38" value="16"><span class="tempval" id="tempval">16 °C</span></div>
    <div class="row"><label>Rain?</label>
      <div class="chips" id="rain"><button class="chip" data-v="false" aria-pressed="true">Dry</button><button class="chip" data-v="true" aria-pressed="false">Rain</button></div></div>
    <div class="row"><label>Occasion</label>
      <div class="chips" id="occ"></div></div>
    <div class="row"><button class="go" id="go">What should I wear?</button></div>
  </div>

  <div id="out"></div>
  <footer>Example wardrobe: synthetic illustrations. Open-weight models, your choice of cloud or local.</footer>
</main>
<script>
const $ = s => document.querySelector(s);
let rain = false, occasion = "commute";
const labels = {commute:"Commute", casual:"Casual", date:"Date", formal:"Formal"};

function chips(el, onpick) {
  el.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    el.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    onpick(b.dataset.v);
  });
}
chips($("#rain"), v => rain = v === "true");
$("#temp").addEventListener("input", e => $("#tempval").textContent = e.target.value + " °C");

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

fetch("/api/status").then(r => r.json()).then(s => {
  const occ = $("#occ");
  s.occasions.forEach((o, i) => {
    const b = document.createElement("button");
    b.className = "chip"; b.dataset.v = o; b.textContent = labels[o] || o; b.setAttribute("aria-pressed", i === 0);
    occ.appendChild(b);
  });
  chips(occ, v => occasion = v);
  occasion = s.occasions[0];
  const host = s => new URL(s).hostname;
  $("#status").textContent = `Styling with ${s.text_model} (${host(s.text_host)}) · photos read by ${s.vision_model} · privacy: ${s.privacy} · ${s.items - s.undescribed}/${s.items} pieces ready`;
});

$("#go").addEventListener("click", async () => {
  const btn = $("#go"); btn.disabled = true; btn.textContent = "Thinking…";
  $("#out").innerHTML = "";
  try {
    const r = await fetch("/api/suggest", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({temp: +$("#temp").value, rain, occasion})});
    if (!r.ok) throw new Error("server said " + r.status);
    const d = await r.json();
    let html = "";
    if (d.undescribed) html += `<div class="warn">${d.undescribed} photos have not been described yet (run <code>todays-outfit describe</code>).</div>`;
    if (d.warning) html += `<div class="warn">${esc(d.warning)}</div>`;
    d.suggestions.forEach((s, n) => {
      html += `<div class="outfit"><div class="pieces">` + s.items.map(i =>
        `<div class="piece"><img src="${i.image}" alt="${esc(i.name)}"><div>${esc(i.name)}</div></div>`).join("") +
        `</div><p class="reason">${esc(s.reason)}</p>` +
        `<span class="tag">${s.source === "model" ? "picked by the model" : "rules-only pick"}${s.relaxed ? " · loosest match" : ""}</span></div>`;
    });
    $("#out").innerHTML = html;
  } catch (e) {
    $("#out").innerHTML = `<div class="warn">Something went wrong: ${esc(e.message)}</div>`;
  } finally { btn.disabled = false; btn.textContent = "What should I wear?"; }
});
</script>
</body>
</html>
