<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Today's Outfit</title>
<style>
:root{--bg:#fbfaf8;--fg:#17181a;--mute:#74777c;--line:#e8e6e1;--card:#fff;--soft:#f1efea;--accent:#1d1f23;--onaccent:#fff;--ok:#2f7d4f;--warn:#9a5b00;--warnbg:#fff4e0;--danger:#b3261e;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#111214;--fg:#f0efec;--mute:#9a9da3;--line:#2a2c30;--card:#18191c;--soft:#202226;--accent:#f0efec;--onaccent:#111214;--ok:#6cc08b;--warn:#f0b35a;--warnbg:#2a2214;--danger:#ff8a80;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 22px 120px}
.view[hidden]{display:none}
h1{font-size:30px;line-height:1.15;letter-spacing:-.02em;margin:6px 0 4px;font-weight:700}
h2{font-size:19px;letter-spacing:-.01em;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 20px;font-size:15px}
.mute{color:var(--mute)}.small{font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-height:46px}
input[type=range]{padding:0;min-height:32px;accent-color:var(--accent)}
.btn{display:block;width:100%;min-height:52px;border-radius:999px;font-weight:600;text-align:center;padding:0 22px;border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.btn.quiet{background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5}
.stack{display:grid;gap:10px;margin-top:18px}
.row{display:flex;gap:10px;align-items:center}
.link{color:var(--mute);text-decoration:underline;text-underline-offset:3px;font-size:15px}
/* Today */
.wxline{display:block;width:100%;text-align:left;color:var(--mute);font-size:15px;padding:4px 0 2px}
.wxline b{color:var(--fg);font-weight:600}
.occ{display:flex;gap:20px;margin:18px 0 18px;overflow-x:auto}
.occ button{color:var(--mute);padding:6px 0;font-size:16px;border-bottom:2px solid transparent}
.occ button[aria-pressed=true]{color:var(--fg);font-weight:600;border-color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:20px 18px 18px;box-shadow:var(--shadow)}
.kicker{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 12px}
.pieces{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
.pieces.n3{grid-template-columns:repeat(3,1fr)}
.piece{margin:0;text-align:center}
.piece img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:var(--soft);border-radius:18px}
.piece figcaption{font-size:13px;color:var(--mute);margin-top:6px;line-height:1.3}
.reason{font-size:18px;line-height:1.45;margin:18px 2px 6px}
.rot{font-size:14px;color:var(--mute);margin:0 2px 4px}
details.more{margin-top:14px;font-size:14px;color:var(--mute)}
details.more summary{cursor:pointer;list-style:none;display:inline-block;padding:6px 0}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:" ›";}
details[open].more summary::after{content:" ⌄"}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:6px 0 0}
.kv dt{color:var(--mute)}.kv dd{margin:0;color:var(--fg);word-break:break-word}
.empty{padding:36px 8px;text-align:center;color:var(--mute)}
.note{background:var(--warnbg);color:var(--warn);border-radius:14px;padding:10px 14px;font-size:15px;margin:10px 0}
.ok{color:var(--ok)}
.spin{color:var(--mute);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
/* Wardrobe */
.pills{display:flex;gap:8px;overflow-x:auto;margin:0 -22px 12px;padding:2px 22px;scrollbar-width:none}
.pill{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:15px;color:var(--mute);background:var(--card)}
.pill[aria-pressed=true]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.pill.dash{border-style:dashed}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;margin-top:14px}
.tile{text-align:left;display:block}
.tile img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:var(--soft);border-radius:18px}
.tile b{display:block;font-weight:600;font-size:15px;margin-top:7px;line-height:1.3}
.tile span{display:block;font-size:13px;color:var(--mute)}
.fab{position:fixed;right:max(20px,calc(50vw - 260px));bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--onaccent);font-size:30px;line-height:1;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:5}
.filters{margin:0 0 4px;font-size:15px}
.filters summary{cursor:pointer;color:var(--mute);list-style:none}
.filters summary::-webkit-details-marker{display:none}
.filters .chips{margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:15px;background:var(--card)}
.chip[aria-pressed=true]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.chip.sug{border-style:dashed;color:var(--mute)}
.chip.on::after{content:" ×";opacity:.6}
.chip.sug::before{content:"+ "}
/* Settings */
.group{margin:0 0 28px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.opt i{flex:0 0 22px;height:22px;border:2px solid var(--line);border-radius:50%;margin-top:1px}
.opt[aria-checked=true] i{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs>div{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;display:grid;justify-items:center;gap:2px;padding:9px 0 8px;font-size:12px;color:var(--mute)}
.tabs button[aria-current=page]{color:var(--fg);font-weight:600}
.tabs svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* Sheets */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;transform:translateY(100%);transition:transform .22s ease;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet>div{max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 22px 60px}
.sheet header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet header h1{font-size:24px;margin:0}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px;margin:6px 0 16px}
.seg button{flex:1;padding:9px 0;border-radius:999px;font-size:15px;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.field{margin:0 0 14px}.field label{display:block;font-size:13px;color:var(--mute);margin:0 0 5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.draft{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;margin:0 0 16px}
.draft .photo{display:block;width:100%;max-height:300px;object-fit:contain;background:var(--soft);border-radius:16px;margin-bottom:12px}
.src{font-size:14px;color:var(--mute);margin:0 0 10px;word-break:break-word}
.big{display:block;width:100%;max-height:340px;object-fit:contain;background:var(--soft);border-radius:20px}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}.spin{animation:none}}
</style>
</head>
<body>
<main>
  <section id="v-today" class="view" aria-label="Today"></section>
  <section id="v-wardrobe" class="view" aria-label="Wardrobe" hidden></section>
  <section id="v-settings" class="view" aria-label="Settings" hidden></section>
</main>
<button class="fab" id="fab" aria-label="Add clothes" hidden>+</button>
<nav class="tabs" aria-label="Main"><div>
  <button data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>Today</button>
  <button data-tab="wardrobe"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>Wardrobe</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</button>
</div></nav>
<div class="sheet" id="wxsheet"><div id="wxbody"></div></div>
<div class="sheet" id="itemsheet"><div id="itembody"></div></div>
<div class="sheet" id="addsheet"><div id="addbody"></div></div>
<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const CATS = [["top","Tops"],["bottom","Bottoms"],["dress","Dresses"],["outer","Outerwear"],["shoes","Shoes"],["accessory","Accessories"]];
const SEASONS = ["spring","summer","autumn","winter"];
async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  if (!r.ok) { let m = r.statusText, kind; try { const j = await r.json(); m = j.detail || m; kind = j.kind; } catch {} const e = new Error(typeof m === "string" ? m : JSON.stringify(m)); e.kind = kind; throw e; }
  return r.json();
}
const send = (method, p, b) => api(p, {method, headers: {"Content-Type": "application/json"}, body: JSON.stringify(b)});
const post = (p, b) => send("POST", p, b), put = (p, b) => send("PUT", p, b);

let status = {}, cfgView = {}, today = null, items = [], rooms = null, occasion = null, idx = 0, justWorn = false, forceNext = false;
let manual = JSON.parse(sessionStorage.getItem("manualWx") || "null");
let catFilter = "all", tagFilter = null, sortBy = "unworn";

/* ---------- tabs ---------- */
function show(tab) {
  if (!["today","wardrobe","settings"].includes(tab)) tab = "today";
  for (const t of ["today","wardrobe","settings"]) $("#v-" + t).hidden = t !== tab;
  $$(".tabs button").forEach(b => b.dataset.tab === tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  $("#fab").hidden = tab !== "wardrobe" || !!status.readonly;
  window.scrollTo(0, 0);
}
$$(".tabs button").forEach(b => b.onclick = () => { location.hash = b.dataset.tab; });
window.addEventListener("hashchange", () => route());
function route() { const t = location.hash.slice(1) || "today"; show(t); if (t === "settings") renderSettings(); }

/* ---------- Today ---------- */
async function loadToday(spinner = true) {
  if (spinner) $("#v-today").innerHTML = `<p class="mute small">&nbsp;</p><p class="spin" style="margin-top:80px;text-align:center">Choosing from your wardrobe…</p>`;
  const q = new URLSearchParams();
  if (occasion) q.set("occasion", occasion);
  if (manual) { q.set("temp", manual.temp); q.set("rain", manual.rain); }
  if (forceNext) { q.set("force", "true"); forceNext = false; }
  try { today = await api("/api/today?" + q); } catch (e) { $("#v-today").innerHTML = `<div class="note">${esc(e.message)}</div>`; return; }
  occasion = today.occasion; idx = 0; justWorn = false;
  renderToday();
}
function wxText() {
  const w = today.weather, sea = cap(today.season);
  if (w.source === "manual") return `<b>${w.temp} °C, ${w.rain ? "rain" : "dry"}</b> (set by you) · ${sea}`;
  if (w.source === "auto") {
    const city = (w.city || "").split(",")[0];
    const lo = w.low_r ?? Math.round(w.low), hi = w.high_r ?? Math.round(w.high);      // same rounding as the command line
    return `<b>${esc(city)} ${lo === hi ? lo : lo + "-" + hi} °C, rain ${w.rain_prob}%</b> · ${sea}`;
  }
  return `<b>Set the weather</b> · ${sea}`;
}
function renderToday() {
  const t = today;
  let h = `<button class="wxline" id="wx" aria-label="Weather: tap to change">${wxText()}</button>`;
  h += `<div class="occ" id="occ">` + (status.occasions || []).map(o => `<button data-v="${o}" aria-pressed="${o === t.occasion}">${cap(o)}</button>`).join("") + `</div>`;
  if (t.needs_weather) {
    h += `<div class="empty">No forecast yet.<br>Tap the line above to pick a temperature, or choose a city in <a class="link" href="#settings">Settings</a>.</div>`;
  } else if (t.worn_today && !t.suggestions.length) {
    h += `<div class="card"><p class="kicker">Logged for today</p><div class="pieces ${t.worn_today.items.length > 2 ? "n3" : ""}">` +
      t.worn_today.items.map(i => `<figure class="piece"><img src="${i.thumb}" alt=""><figcaption>${esc(i.name)}</figcaption></figure>`).join("") +
      `</div><div class="stack"><button class="btn quiet" id="undo">Undo</button><button class="btn quiet" id="another2">Suggest something else</button></div></div>`;
  } else if (!t.suggestions.length) {
    h += `<div class="empty">${esc(t.warning || "Nothing in this room fits that weather and occasion.")}${t.outside_room ? `<br><a class="link" href="#settings">Switch season</a>` : ""}</div>`;
  } else {
    const s = t.suggestions[idx];
    h += `<article class="card"><p class="kicker">${idx === 0 ? "Today's pick" : "Another idea"}</p>`;
    h += `<div class="pieces ${s.items.length > 2 ? "n3" : ""}">` + s.items.map(i => `<figure class="piece"><img src="${i.thumb}" alt="${esc(i.name)}"><figcaption>${esc(i.name)}</figcaption></figure>`).join("") + `</div>`;
    h += `<p class="reason">${esc(s.reason)}</p>`;
    if (s.note) h += `<p class="rot">${esc(s.note)}</p>`;
    if (t.worn_today) h += `<p class="rot">You already logged today; “Wear this” replaces it.</p>`;
    if (justWorn) h += `<p class="ok">Logged. Enjoy.</p>`;
    h += `<div class="stack"><button class="btn primary" id="wear">Wear this</button><button class="btn quiet" id="skip">Show another</button></div>`;
    h += `<details class="more"><summary>Details</summary><dl class="kv">` +
      `<dt>Picked by</dt><dd>${s.source === "model" ? esc(cfgView.details?.text_model || "the language model") : "rules only (no model)"}</dd>` +
      `<dt>Considered</dt><dd>${t.candidates} outfits in the ${esc(t.season)} room (${t.wardrobe_size} pieces)</dd>` +
      (t.latency != null ? `<dt>Took</dt><dd>${t.latency.toFixed ? t.latency.toFixed(1) : t.latency} s</dd>` : "") +
      (s.relaxed ? `<dt>Match</dt><dd>loosest match: the rules had to relax something</dd>` : "") +
      (t.warning ? `<dt>Note</dt><dd>${esc(t.warning)}</dd>` : "") +
      `</dl></details></article>`;
  }
  $("#v-today").innerHTML = h;
  bindToday();
}
function bindToday() {
  const on = (s, f) => { const e = $(s); if (e) e.onclick = f; };
  on("#wx", openWeather);
  $$("#occ button").forEach(c => c.onclick = () => { occasion = c.dataset.v; loadToday(); });
  on("#wear", async () => {
    const s = today.suggestions[idx];
    try { await post("/api/wear", {items: s.items.map(i => i.id), occasion: today.occasion}); } catch (e) { alert(e.message); return; }
    today.worn_today = {items: s.items, occasion: today.occasion}; today.suggestions = [];
    renderToday(); loadWardrobe();
  });
  on("#skip", async () => {
    const s = today.suggestions[idx];
    try { await post("/api/skip", {items: s.items.map(i => i.id), occasion: today.occasion}); } catch (e) { alert(e.message); return; }
    if (idx + 1 < today.suggestions.length) { idx++; renderToday(); } else { loadToday(); }
  });
  on("#undo", async () => { await api("/api/wear", {method: "DELETE"}); await loadWardrobe(); loadToday(); });
  on("#another2", () => { forceNext = true; loadToday(); });
}
function openWeather() {
  const m = manual || {temp: today.weather.temp != null ? Math.round(today.weather.temp) : 16, rain: !!today.weather.rain};
  let rain = m.rain;
  $("#wxbody").innerHTML = `<header><h1>Weather</h1><button class="link" id="wxclose">Close</button></header>
    <p class="mute small">${today.weather.source === "auto" ? esc(today.weather.label) : "No forecast yet."} Override it for today if it is wrong.</p>
    <div class="field"><label>Temperature: <b id="tv">${m.temp} °C</b></label><input id="temp" type="range" min="-5" max="38" value="${m.temp}"></div>
    <div class="chips" id="rainchips"><button class="chip" data-v="false" aria-pressed="${!rain}">Dry</button><button class="chip" data-v="true" aria-pressed="${rain}">Rain</button></div>
    <div class="stack"><button class="btn primary" id="usem">Use this</button>${today.has_location ? `<button class="btn quiet" id="usef">Use the forecast</button>` : `<a class="link" href="#settings" id="tocity" style="text-align:center">Choose a city for the forecast</a>`}</div>`;
  $("#wxsheet").classList.add("open");
  const close = () => $("#wxsheet").classList.remove("open");
  $("#wxclose").onclick = close;
  $("#temp").oninput = e => $("#tv").textContent = e.target.value + " °C";
  $$("#rainchips .chip").forEach(c => c.onclick = () => { rain = c.dataset.v === "true"; $$("#rainchips .chip").forEach(x => x.setAttribute("aria-pressed", x === c)); });
  $("#usem").onclick = () => { manual = {temp: +$("#temp").value, rain}; sessionStorage.setItem("manualWx", JSON.stringify(manual)); close(); loadToday(); };
  if ($("#usef")) $("#usef").onclick = () => { manual = null; sessionStorage.removeItem("manualWx"); close(); loadToday(); };
  if ($("#tocity")) $("#tocity").onclick = close;
}

/* ---------- Wardrobe ---------- */
async function loadWardrobe() {
  [items, rooms] = await Promise.all([api("/api/wardrobe"), api("/api/rooms")]);
  renderWardrobe();
}
function ago(it) {
  if (it.last_worn === null) return it.never_logged ? "never worn" : "";
  const d = it.days_since; return d >= 7 ? `not worn in ${d} days` : d === 0 ? "worn today" : d === 1 ? "worn yesterday" : "";
}
function renderWardrobe() {
  const el = $("#v-wardrobe"), sea = rooms ? rooms.current : "";
  const other = rooms ? rooms.total - rooms.in_room : 0;
  const counts = {all: items.length}; items.forEach(i => counts[i.category] = (counts[i.category] || 0) + 1);
  let list = items.filter(i => (catFilter === "all" || i.category === catFilter) && (!tagFilter || (i.tags || []).includes(tagFilter)));
  list.sort((a, b) => sortBy === "name" ? a.name.localeCompare(b.name)
    : sortBy === "recent" ? (a.days_since ?? 9999) - (b.days_since ?? 9999) : (b.unworn_days - a.unworn_days) || a.name.localeCompare(b.name));
  let h = `<h1>Wardrobe</h1><p class="sub">${cap(sea)} room · ${items.length} piece${items.length === 1 ? "" : "s"}${other ? ` · ${other} in other rooms` : ""}</p>`;
  if (status.readonly) h += `<p class="note">Read-only example wardrobe: you can look around, but adding and logging are off. Start the app with <code>--demo</code> for a writable copy.</p>`;
  h += `<div class="pills" id="cats">` + [["all","All"], ...CATS].filter(([k]) => counts[k]).map(([k, n]) => `<button class="pill" data-v="${k}" aria-pressed="${catFilter === k}">${n} ${counts[k]}</button>`).join("") + `</div>`;
  const tags = rooms ? rooms.tags : [];
  h += `<details class="filters" ${tagFilter ? "open" : ""}><summary>Filter by tag${tagFilter ? ": " + esc(tagFilter) : ""} · sort ›</summary><div class="chips">` +
    tags.map(t => `<button class="chip" data-tag="${esc(t.tag)}" aria-pressed="${tagFilter === t.tag}">${esc(t.tag)} <span class="mute">${t.n}</span></button>`).join("") +
    `</div><div class="field" style="margin-top:12px"><label>Sort</label><select id="sort"><option value="unworn">Longest unworn first</option><option value="recent">Recently worn first</option><option value="name">Name</option></select></div></details>`;
  if (!items.length) {
    h += `<div class="empty">${rooms && rooms.total ? `Nothing in your ${esc(sea)} room yet.<br>${rooms.total} pieces live in other rooms: change the season in <a class="link" href="#settings">Settings</a>.` : `Your wardrobe is empty.<br>Tap <b>+</b> and photograph what you own.`}</div>`;
  } else if (!list.length) {
    h += `<div class="empty">No piece matches that filter.</div>`;
  } else {
    h += `<div class="grid">` + list.map(i => `<button class="tile" data-id="${esc(i.id)}"><img loading="lazy" src="${i.thumb}" alt=""><b>${esc(i.name)}</b><span>${esc(ago(i))}</span></button>`).join("") + `</div>`;
  }
  el.innerHTML = h;
  $$("#cats .pill").forEach(c => c.onclick = () => { catFilter = c.dataset.v; renderWardrobe(); });
  $$(".filters .chip").forEach(c => c.onclick = () => { tagFilter = tagFilter === c.dataset.tag ? null : c.dataset.tag; renderWardrobe(); });
  const so = $("#sort"); if (so) { so.value = sortBy; so.onchange = () => { sortBy = so.value; renderWardrobe(); }; }
  $$(".tile").forEach(t => t.onclick = () => openItem(t.dataset.id));
}
$("#fab").onclick = () => openAdd();

/* ---------- piece form (shared by edit and add) ---------- */
function fieldsForm(f, p) {
  return `
    <div class="field"><label>Name (optional)</label><input type="text" id="${p}name" value="${esc(f.name || "")}" placeholder="${esc((f.color || "") + " " + (f.type || ""))}"></div>
    <div class="two">
      <div class="field"><label>Category</label><select id="${p}category">${CATS.map(([k, n]) => `<option value="${k}" ${f.category === k ? "selected" : ""}>${n}</option>`).join("")}</select></div>
      <div class="field"><label>Type</label><input type="text" id="${p}type" value="${esc(f.type)}" placeholder="e.g. jeans"></div>
      <div class="field"><label>Colour</label><input type="text" id="${p}color" value="${esc(f.color)}"></div>
      <div class="field"><label>Material</label><input type="text" id="${p}material" value="${esc(f.material)}"></div>
      <div class="field"><label>Warmth (1 light – 5 heavy)</label><select id="${p}warmth">${[1,2,3,4,5].map(n => `<option ${+f.warmth === n ? "selected" : ""}>${n}</option>`).join("")}</select></div>
      <div class="field"><label>Formality (1 lounge – 5 formal)</label><select id="${p}formality">${[1,2,3,4,5].map(n => `<option ${+f.formality === n ? "selected" : ""}>${n}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label>Rooms (seasons) <button type="button" class="link" id="${p}reseason" style="margin-left:6px">set from warmth</button></label>
      <div class="chips" id="${p}season">${SEASONS.map(s => `<button type="button" class="chip" data-v="${s}" aria-pressed="${(f.season || []).includes(s)}">${s}</button>`).join("")}</div></div>
    <div class="field"><label>Tags <span class="mute">tap to remove · dashed = suggestion, tap to add</span></label>
      <div class="chips" id="${p}tags"></div>
      <div class="row" style="margin-top:8px"><input type="text" id="${p}newtag" placeholder="add a tag" style="flex:1"><button type="button" class="chip" id="${p}addtag">Add</button></div>
      <div class="row" style="margin-top:8px"><button type="button" class="link" id="${p}moretags">More ideas from the model</button><span class="mute small" id="${p}tagmsg"></span></div></div>
    <div class="field"><label>Notes</label><input type="text" id="${p}notes" value="${esc(f.notes)}"></div>`;
}
function formState(f, p) { return {tags: [...(f.tags || [])], sug: [], p}; }
function drawTags(ts) {
  $("#" + ts.p + "tags").innerHTML = ts.tags.map(t => `<button type="button" class="chip on" data-t="${esc(t)}" aria-pressed="true">${esc(t)}</button>`).join("") +
    ts.sug.filter(t => !ts.tags.includes(t)).map(t => `<button type="button" class="chip sug" data-t="${esc(t)}">${esc(t)}</button>`).join("");
  $$("#" + ts.p + "tags .chip").forEach(c => c.onclick = () => {
    const t = c.dataset.t;
    if (ts.tags.includes(t)) { ts.tags = ts.tags.filter(x => x !== t); if (!ts.sug.includes(t)) ts.sug.push(t); } else ts.tags.push(t);
    drawTags(ts);
  });
}
function readForm(p, ts) {
  const g = k => $("#" + p + k).value;
  return {name: g("name").trim(), category: g("category"), type: g("type").trim(), color: g("color").trim(), material: g("material").trim(),
          warmth: +g("warmth"), formality: +g("formality"), notes: g("notes").trim(), tags: ts.tags,
          season: $$(`#${p}season .chip`).filter(c => c.getAttribute("aria-pressed") === "true").map(c => c.dataset.v)};
}
function bindForm(p, ts) {
  $$(`#${p}season .chip`).forEach(c => c.onclick = () => c.setAttribute("aria-pressed", c.getAttribute("aria-pressed") !== "true"));
  drawTags(ts);
  const addTag = () => { const v = $("#" + p + "newtag").value.trim().toLowerCase(); if (v && !ts.tags.includes(v)) { ts.tags.push(v); drawTags(ts); } $("#" + p + "newtag").value = ""; };
  $("#" + p + "addtag").onclick = addTag;
  $("#" + p + "newtag").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); addTag(); } };
  $("#" + p + "reseason").onclick = async () => {
    const r = await post("/api/tags/suggest", {fields: readForm(p, ts), model: false});
    $$(`#${p}season .chip`).forEach(c => c.setAttribute("aria-pressed", r.seasons.includes(c.dataset.v)));
    ts.sug = [...new Set([...ts.sug, ...r.auto])]; drawTags(ts);
  };
  $("#" + p + "moretags").onclick = async () => {
    const b = $("#" + p + "moretags"), msg = $("#" + p + "tagmsg"); b.disabled = true; msg.textContent = "asking…";
    try {
      const r = await post("/api/tags/suggest", {fields: readForm(p, ts), model: true});
      ts.sug = [...new Set([...ts.sug, ...r.auto, ...r.model])];
      msg.textContent = r.error ? r.error : (r.model.length ? "" : "no new ideas");
      drawTags(ts);
    } catch (e) { msg.textContent = e.message; }
    b.disabled = false;
  };
}

/* ---------- piece sheet ---------- */
function closeSheet(id) { $(id).classList.remove("open"); }
function openItem(id) {
  const it = items.find(i => i.id === id); if (!it) return;
  const ts = formState(it, "e_"); ts.sug = (it.tags_auto || []).filter(t => !ts.tags.includes(t));
  $("#itembody").innerHTML = `<header><h1>${esc(it.name)}</h1><button class="link" id="iclose">Close</button></header>
    <img class="big" src="${it.image}" alt="${esc(it.name)}">
    <p class="mute small" style="margin:10px 0">${it.last_worn ? `Last worn ${it.last_worn} · ${it.wear_count}× in the log` : (it.never_logged ? "No wear logged since the log began." : "No wear logged yet.")}</p>
    ${status.readonly ? "" : `<button class="btn quiet" id="iwore" style="margin-bottom:18px">I wore this today</button>`}
    ${fieldsForm(it, "e_")}<div id="ierr"></div>
    ${status.readonly ? "" : `<div class="stack"><button class="btn primary" id="isave">Save changes</button><button class="btn quiet danger" id="idel">Delete</button></div>`}`;
  $("#itemsheet").classList.add("open"); bindForm("e_", ts);
  $("#iclose").onclick = () => closeSheet("#itemsheet");
  const fail = e => $("#ierr").innerHTML = `<div class="note">${esc(e.message)}</div>`;
  const done = async () => { closeSheet("#itemsheet"); await loadWardrobe(); loadToday(false); };
  if ($("#iwore")) $("#iwore").onclick = async () => { try { await post("/api/wear", {items: [id], merge: true, occasion}); } catch (e) { return fail(e); } done(); };
  if ($("#isave")) $("#isave").onclick = async () => { try { await put("/api/items/" + encodeURIComponent(id), readForm("e_", ts)); } catch (e) { return fail(e); } done(); };
  if ($("#idel")) $("#idel").onclick = async () => {
    if (!confirm(`Delete "${it.name}" from your wardrobe? Its photo and its wear log entries are removed.`)) return;
    try { await api("/api/items/" + encodeURIComponent(id), {method: "DELETE"}); } catch (e) { return fail(e); } done();
  };
}

/* ---------- Add clothes ---------- */
let draftN = 0, addMode = "photos";
function describeMode() {
  const d = cfgView.details || {}, host = s => { try { return new URL(s).hostname; } catch { return s; } };
  const local = ["localhost", "127.0.0.1", "::1"].includes(host(d.vision_host));
  return local ? "local" : d.privacy === "off" ? "cloud" : "manual";
}
function openAdd(mode) {
  addMode = mode || addMode;
  const d = cfgView.details || {}, dm = describeMode();
  const info = dm === "cloud" ? `A 512-px copy of each photo is read by ${d.vision_model} (${new URL(d.vision_host).hostname}). You review the result before saving.`
    : dm === "local" ? `Photos are read on this machine; nothing leaves it.` : `Privacy mode “${d.privacy}”: photos stay here, so fill the fields in by hand.`;
  const linkInfo = d.privacy === "local-only" ? `Privacy mode “local-only” does not contact any web site, so links are off. Upload a picture instead.`
    : `Works with public product pages that show a picture without logging in. The page's title and picture are read; ${dm === "cloud" ? "the picture goes to the vision model" : "the picture stays here"}. Taobao, Xiaohongshu, JD and similar often block this: then upload a screenshot instead.`;
  $("#addbody").innerHTML = `<header><h1>Add clothes</h1><button class="link" id="addclose">Done</button></header>
    <div class="seg" id="seg"><button data-m="photos" aria-pressed="${addMode === "photos"}">Photos</button><button data-m="link" aria-pressed="${addMode === "link"}">Paste a link</button></div>
    <div id="pane-photos" ${addMode === "photos" ? "" : "hidden"}>
      <p class="mute small">${esc(info)}</p>
      <div class="stack" style="margin-top:12px"><button class="btn primary" id="pick">Choose photos</button><button class="btn quiet" id="snap">Take a photo</button></div>
      <input type="file" id="fpick" accept="image/*" multiple hidden><input type="file" id="fsnap" accept="image/*" capture="environment" hidden>
    </div>
    <div id="pane-link" ${addMode === "link" ? "" : "hidden"}>
      <p class="mute small">${esc(linkInfo)}</p>
      <div class="field" style="margin-top:12px"><input type="url" id="url" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://…" ${d.privacy === "local-only" ? "disabled" : ""}></div>
      <button class="btn primary" id="fetchlink" ${d.privacy === "local-only" ? "disabled" : ""}>Fetch this page</button>
    </div>
    <div id="drafts" style="margin-top:20px"></div>`;
  $("#addsheet").classList.add("open");
  $("#addclose").onclick = () => { closeSheet("#addsheet"); loadWardrobe(); loadToday(false); };
  $$("#seg button").forEach(b => b.onclick = () => { addMode = b.dataset.m; $$("#seg button").forEach(x => x.setAttribute("aria-pressed", x === b)); $("#pane-photos").hidden = addMode !== "photos"; $("#pane-link").hidden = addMode !== "link"; });
  $("#pick").onclick = () => $("#fpick").click(); $("#snap").onclick = () => $("#fsnap").click();
  for (const id of ["#fpick", "#fsnap"]) $(id).onchange = async e => { const files = [...e.target.files]; e.target.value = ""; for (const f of files) await addDraft(f); };
  const go = () => { $("#url").blur(); addFromLink($("#url").value.trim()); };   // blur: close the phone keyboard so the result is visible
  $("#fetchlink").onclick = go; $("#url").onkeydown = e => { if (e.key === "Enter") go(); };
}
function draftBox() {
  const n = ++draftN, box = document.createElement("div"); box.className = "draft"; box.id = "draft" + n; $("#drafts").prepend(box); return [box, "d" + n + "_"];
}
async function addDraft(file) {
  const [box, p] = draftBox();
  box.innerHTML = `<img class="photo" src="${URL.createObjectURL(file)}" alt=""><p class="spin">${describeMode() === "manual" ? "Uploading…" : "Reading this photo…"}</p>`;
  let st;
  try { st = await api("/api/upload?describe=" + (describeMode() !== "manual"), {method: "POST", headers: {"Content-Type": file.type || "application/octet-stream"}, body: file}); }
  catch (e) { box.innerHTML = `<div class="note">${esc(e.message)}</div>`; return; }
  reviewDraft(box, p, st, null);
}
async function addFromLink(url) {
  if (!url) return;
  $$("#drafts .draft.failed").forEach(b => b.remove());   // earlier failed attempts are not worth keeping on screen
  const [box, p] = draftBox();
  box.innerHTML = `<p class="spin">Reading the page… (up to a minute with the vision model)</p>`;
  $("#fetchlink").disabled = true;
  try {
    const st = await post("/api/import-link", {url});
    reviewDraft(box, p, st, st.source);
  } catch (e) {
    box.classList.add("failed");
    box.innerHTML = `<div class="note"><b>Could not use that link.</b><br>${esc(e.message)}</div>
      <button class="btn quiet" id="${p}toup" style="margin-top:8px">Upload a picture instead</button>`;
    $("#" + p + "toup").onclick = () => { box.remove(); addMode = "photos"; $("#seg button[data-m=photos]").click(); };
  }
  $("#fetchlink").disabled = false;
  box.scrollIntoView({block: "nearest", behavior: "smooth"});
}
function reviewDraft(box, p, st, src) {
  const ts = formState(st.fields, p);
  box.innerHTML = `<img class="photo" src="/staged/${st.staging_id}" alt="">` +
    (src ? `<p class="src">From <b>${esc(src.host)}</b>${src.title ? ": " + esc(src.title) : ""}</p>` : "") +
    (st.describe_error ? `<div class="note">${esc(st.describe_error)}</div>` : `<p class="mute small">Read automatically. Please check.</p>`) +
    (st.duplicate_of ? `<div class="note">This looks like a photo you already added (${esc(st.duplicate_of)}).</div>` : "") +
    fieldsForm(st.fields, p) + `<div id="${p}err"></div><div class="stack"><button class="btn primary" id="${p}save">Save piece</button><button class="btn quiet" id="${p}drop">Discard</button></div>`;
  bindForm(p, ts);
  $("#" + p + "drop").onclick = async () => { await api("/api/staged/" + st.staging_id, {method: "DELETE"}); box.remove(); };
  $("#" + p + "save").onclick = async () => {
    const f = readForm(p, ts);
    try { await post("/api/items", {staging_id: st.staging_id, fields: f}); }
    catch (e) { $("#" + p + "err").innerHTML = `<div class="note">${esc(e.message)}</div>`; return; }
    box.innerHTML = `<p class="ok">Saved: ${esc(f.name || f.color + " " + f.type)}</p>`;
    loadWardrobe();
  };
}

/* ---------- Settings ---------- */
async function renderSettings() {
  try { cfgView = await api("/api/settings"); } catch (e) { $("#v-settings").innerHTML = `<div class="note">${esc(e.message)}</div>`; return; }
  const s = cfgView.season, d = cfgView.details, loc = cfgView.location;
  const opts = [["auto", `Automatic <span class="mute">· suggested for today: ${cap(s.auto)}${s.hemisphere === "south" ? " (southern hemisphere)" : ""}</span>`], ...SEASONS.map(x => [x, cap(x)])];
  const sel = s.override || "auto";
  let h = `<h1>Settings</h1><p class="sub">Calm by default; the technical details are folded at the bottom.</p>
    <div class="group"><h2>Season room</h2><p class="mute small" style="margin:0 0 6px">Only this room is shown in Wardrobe and used for choosing outfits. Now: <b>${cap(s.current)}</b>.</p>` +
    opts.map(([k, label]) => `<button class="opt" role="radio" aria-checked="${sel === k}" data-s="${k}"><i></i><span>${label}</span></button>`).join("") + `</div>
    <div class="group"><h2>City</h2><p class="mute small" style="margin:0 0 10px">${loc ? "Forecast for <b>" + esc(loc.name) + "</b>." : "No city yet: the forecast needs one."} Only the city's coordinates are sent to open-meteo.com.</p>
      <div class="row"><input type="text" id="city" placeholder="Search a city, e.g. Shanghai" style="flex:1"><button class="chip" id="findcity">Find</button></div>
      <div class="chips" id="cityres" style="margin-top:10px"></div></div>
    <details class="more" style="margin-top:8px"><summary>Details</summary><dl class="kv">
      <dt>Privacy mode</dt><dd>${esc(d.privacy)}</dd>
      <dt>Picks by</dt><dd>${esc(d.text_model)} · ${esc(host(d.text_host))}</dd>
      <dt>Reads photos with</dt><dd>${esc(d.vision_model)} · ${esc(host(d.vision_host))}</dd>
      <dt>Pieces</dt><dd>${d.pieces_ready}/${d.pieces} ready (described)</dd>
      <dt>Saved descriptions</dt><dd>${d.cached_descriptions} cached</dd>
      <dt>Data folder</dt><dd>${esc(d.data_dir)}${d.readonly ? " (read-only example)" : ""}</dd>
      <dt>Date used</dt><dd>${esc(d.today)}</dd>
      <dt>Version</dt><dd>${esc(d.version)}</dd></dl>
      <p class="mute small">Wear history and settings stay in local files next to the wardrobe. Rule badges and sources are shown under “Details” on the Today card.</p></details>`;
  $("#v-settings").innerHTML = h;
  $$(".opt").forEach(o => o.onclick = async () => {
    try { await put("/api/settings/season", {season: o.dataset.s}); } catch (e) { alert(e.message); return; }
    catFilter = "all"; tagFilter = null; await renderSettings(); await loadWardrobe(); loadToday(false);
  });
  const find = async () => {
    const q = $("#city").value.trim(); if (!q) return;
    $("#cityres").innerHTML = `<span class="spin">Searching…</span>`;
    try {
      const res = await api("/api/geocode?q=" + encodeURIComponent(q));
      $("#cityres").innerHTML = res.length ? res.map((r, k) => `<button class="chip" data-k="${k}">${esc(r.name)}</button>`).join("") : `<span class="mute">No match.</span>`;
      $$("#cityres .chip").forEach(c => c.onclick = async () => {
        try { await put("/api/settings/location", res[+c.dataset.k]); } catch (e) { alert(e.message); return; }
        manual = null; sessionStorage.removeItem("manualWx"); await renderSettings(); await loadWardrobe(); loadToday(false);
      });
    } catch (e) { $("#cityres").innerHTML = `<span class="note">${esc(e.message)}</span>`; }
  };
  $("#findcity").onclick = find; $("#city").onkeydown = e => { if (e.key === "Enter") find(); };
}
const host = s => { try { return new URL(s).hostname; } catch { return s; } };

/* ---------- boot ---------- */
(async () => {
  status = await api("/api/status");
  cfgView = await api("/api/settings");
  const q = new URLSearchParams(location.search);
  if (status.occasions.includes(q.get("occasion"))) occasion = q.get("occasion");
  route();
  await loadWardrobe();
  loadToday();
})();
</script>
</body>
</html>
