[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dresser"
version = "0.3.0"
description = "Wardrobe stylist that suggests outfits from clothes you already own, powered by open-weight models via any OpenAI-compatible endpoint."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.26", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dresser = "dresser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dresser = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
